name: Gemini Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'The ID of the pending job in Supabase'
        required: true
        type: string

jobs:
  process-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./worker
        run: npm ci || npm install

      - name: Install Playwright Browsers
        working-directory: ./worker
        run: npx playwright install --with-deps chromium

      - name: Connect to Tailscale (Mobile Exit Node)
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Route Traffic through Phone
        run: |
          echo "Pinging the Android Phone to ensure it is reachable over Tailscale..."
          tailscale ping 100.109.173.64 || true
          echo "Setting Android Phone as the Exit Node..."
          sudo tailscale set --exit-node=100.109.173.64
          echo "Routing complete! Verifying new public IP..."
          curl -4 ifconfig.me

      - name: Run Worker
        working-directory: ./worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          JOB_ID: ${{ inputs.job_id }}
        run: xvfb-run --auto-servernum -- node worker.js
