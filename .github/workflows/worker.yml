name: Gemini Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'The ID of the pending job in Supabase'
        required: true
        type: string

jobs:
  process-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./worker
        run: npm ci || npm install

      - name: Install Playwright Browsers
        working-directory: ./worker
        run: npx playwright install --with-deps chromium

      - name: Connect to Tailscale (Mobile Exit Node)
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Route Traffic - Primary Laptop, Fallback Phone
        run: |
          set -x
          LAPTOP_IP="100.124.114.36" # <-- PLEASE REPLACE THIS WITH YOUR LAPTOP'S TAILSCALE IP
          MOBILE_IP="100.109.173.64"
          
          if tailscale ping -c 1 $LAPTOP_IP; then
            echo "Laptop is awake! Setting Laptop as Exit Node..."
            sudo tailscale set --exit-node=$LAPTOP_IP
          elif tailscale ping -c 1 $MOBILE_IP; then
            echo "Laptop unreachable. Falling back to Android Phone..."
            sudo tailscale set --exit-node=$MOBILE_IP
          else
            echo "CRITICAL: Both Laptop and Phone are unreachable!"
            exit 1
          fi
          
          echo "Routing complete! Verifying new public IP..."
          curl -4 --connect-timeout 10 ifconfig.me || echo "CURL TIMED OUT! The exit node is blocking internet traffic!"

      - name: Run Worker
        working-directory: ./worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          JOB_ID: ${{ inputs.job_id }}
        run: xvfb-run --auto-servernum -- node worker.js
